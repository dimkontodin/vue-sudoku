name: Release Android

# Push a tag like v1.2.0 to build a signed Android App Bundle and attach it to a GitHub Release.
# Upload the .aab to the Play Console by hand. See docs/releasing.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry run: version to build, e.g. 0.0.1 (builds and uploads the bundle as a workflow artifact, no release)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      VERSION_INPUT: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      # versionName is the tag without its "v"; versionCode must strictly increase on every Play upload,
      # so it is derived from the semver: major*10000 + minor*100 + patch (1.2.0 -> 10200).
      - name: Derive Android version from tag
        run: |
          version="${VERSION_INPUT#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::'$VERSION_INPUT' is not a plain X.Y.Z version"; exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be <= 99 for the versionCode scheme"; exit 1
          fi
          echo "ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm nx run @vue-sudoku/sudoku-mobile:android-bundle

      - name: Name the bundle
        run: |
          cp apps/sudoku-mobile/android/app/build/outputs/bundle/release/app-release.aab \
             "$RUNNER_TEMP/sudoku-${ANDROID_VERSION_NAME}.aab"

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-${{ env.ANDROID_VERSION_NAME }}-aab
          path: ${{ runner.temp }}/sudoku-${{ env.ANDROID_VERSION_NAME }}.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION_INPUT" \
            "$RUNNER_TEMP/sudoku-${ANDROID_VERSION_NAME}.aab" \
            --title "$VERSION_INPUT" \
            --generate-notes \
            --verify-tag
