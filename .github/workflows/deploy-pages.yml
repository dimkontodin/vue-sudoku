name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels a deploy still waiting, never one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm nx run-many -t test -p @vue-sudoku/sudoku-core @vue-sudoku/sudoku-web

      - name: Build
        run: pnpm nx build sudoku-web
        env:
          # Project sites live at https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/

      # Pages has no server-side routing: a deep link like /stats would 404.
      # Serving index.html as 404.html lets the Vue router take over.
      - name: SPA fallback
        run: cp apps/sudoku-web/dist/index.html apps/sudoku-web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/sudoku-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
